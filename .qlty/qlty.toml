# Reference: https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/*.d.ts",
    "**/build/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.30.2"

[runtimes.enabled]
node = "24.18.0"

# The shared source enables the common linters and scanners, sets the smells
# policy and defines the Biome and ESLint drivers; only the plugins it leaves
# out, and the TypeScript tooling specific to this repository, are added here.
[[plugin]]
name = "shellcheck"

[[plugin]]
name = "shfmt"
mode = "comment"

[[plugin]]
name = "biome"
version = "2.5.6"
mode = "comment"

# Knip runs through `npm run deadcode`; qlty passes its config twice.

# The type-aware ESLint layer resolves this repository's own dependencies.
[plugins.definitions.eslint.drivers.lint]
prepare_script = "npm ci"

[[plugin]]
name = "eslint"
mode = "comment"
package_file = ".qlty/configs/eslint/package.json"
package_filters = ["eslint", "typescript", "typescript-eslint", "@typescript-eslint", "eslint-plugin-jsdoc", "yaml-eslint-parser", "@sinemacula/coding-standards"]
