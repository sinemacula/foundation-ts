name: Tests

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    workflow_dispatch:

concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # No browser surface, so the e2e job is off.
    tests:
        uses: sinemacula/.github/.github/workflows/node-tests.yml@v3.0.2
        # The shared jobs inherit only what this job grants; the coverage upload
        # signs in through OIDC.
        permissions:
            contents: read
            id-token: write
        with:
            run-e2e: false
