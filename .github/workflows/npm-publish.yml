# ==============================================================================
# NPM PUBLISH
# ==============================================================================
# release-please pushes the `v*` tag with a GitHub App token (`use-app-token` in
# release.yml) because a tag pushed with the default token triggers nothing.
# ==============================================================================
name: npm-publish

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        tags:
            -   v*
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
concurrency:
    group: npm-publish-${{ github.ref }}
    cancel-in-progress: false

# ==============================================================================
# PERMISSIONS
# ==============================================================================
# Trusted publishing signs in through OIDC, so no npm token is needed.
permissions:
    contents: read
    id-token: write

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: PUBLISH TO NPM
    # ==========================================================================
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: '26'
                    registry-url: https://registry.npmjs.org/
                    cache: npm

            # The `prepare` script builds `dist/`, so installing is the build.
            -   name: Install dependencies
                run: npm ci

            -   name: Verify tag matches package.json version
                run: |
                    TAG_VERSION="${GITHUB_REF_NAME#v}"
                    PKG_VERSION="$(node -p 'require("./package.json").version')"
                    if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                        echo "Tag $GITHUB_REF_NAME (=> $TAG_VERSION) does not match package.json version $PKG_VERSION" >&2
                        exit 1
                    fi
                    echo "Publishing $PKG_VERSION"

            -   name: Show packed file list (dry run)
                run: npm pack --dry-run

            -   name: Publish
                run: npm publish --provenance --access public
