# ==============================================================================
# RELEASE
# ==============================================================================
name: Release

# ==============================================================================
# TRIGGER
# ==============================================================================
on:
    push:
        branches: [ master ]

# ==============================================================================
# CONCURRENCY
# ==============================================================================
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: write
    pull-requests: write

jobs:

    # ==========================================================================
    # JOB: RELEASE
    # ==========================================================================
    release:
        uses: sinemacula/.github/.github/workflows/release.yml@v3.2.0
        secrets: inherit
        with:
            release-type: node
            # Below 1.0.0 every release is a new minor, so `^0.x` never picks up
            # a breaking change.
            versioning-strategy: always-bump-minor
            use-app-token: true
