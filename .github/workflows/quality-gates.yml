# ==============================================================================
# QUALITY GATES
# ==============================================================================
name: Quality Gates

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    schedule:
        -   cron: 0 3 * * 1
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
# The event name stops a merge to master cancelling a scheduled or manual run.
concurrency:
    group: quality-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: GATES
    # ==========================================================================
    # Knip and mutation (scoped on PRs, full on schedule); no bundle ships, so
    # the size budget is off.
    gates:
        uses: sinemacula/.github/.github/workflows/node-quality-gates.yml@v3.2.0
        # The shared jobs inherit only what this job grants.
        permissions:
            contents: read
            packages: read
        with:
            run-size: false
